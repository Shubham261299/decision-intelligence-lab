[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionlab"
version = "0.1.0"
description = "An experimental framework for evaluating structured decisions"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3"]

[project.scripts]
decisionlab = "decisionlab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff", "mypy"]
demo = ["streamlit>=1.32,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decisionlab = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: opt-in OpenAI API integration tests requiring environment credentials"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
